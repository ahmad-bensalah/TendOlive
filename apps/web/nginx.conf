# The React website on http://localhost:5173 (host port 5173 -> 80). Same paths as frontend/vite.config.ts proxies:
# /api, /retrieve and /health go to the RAG service; everything else is the built app (HashRouter: one index.html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    # Docker's DNS, so nginx starts even while the rag container is not up yet (resolved per request)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rag http://rag:8001;

    location ~ ^/(api|retrieve|health)(/|$) {
        proxy_pass $rag;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # the benchmark / test runs and a first index build can take minutes
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
